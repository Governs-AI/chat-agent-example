name: E2E Tests

on:
  push:
    branches: [dev, main, 'feat/**']
  pull_request:
    branches: [dev, main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: governs_user
          POSTGRES_PASSWORD: governs_password
          POSTGRES_DB: governs_ai_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_BASE_URL: http://localhost:3004
      GOVERNSAI_ISSUER: http://localhost:8088/realms/governs-ai
      GOVERNSAI_CLIENT_ID: governs-chat
      GOVERNSAI_CLIENT_SECRET: ${{ secrets.GOVERNSAI_CLIENT_SECRET }}
      PRECHECK_URL: http://localhost:8082
      PLATFORM_URL: http://localhost:3002
      NEXTAUTH_SECRET: ci-test-secret
      NEXTAUTH_URL: http://localhost:3004
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm dlx playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
